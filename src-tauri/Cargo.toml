[package]
name = "launcher"
version = "0.1.7"
description = "Launcher de jogos para TV, controlado 100% por joystick"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Versão de teste: liga os gatilhos por arquivo do menu do Guia (nunca nas publicações).
diagnostico = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56.0"
windows-core = "0.62"
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Enumeration", "Foundation", "Win32_Devices_Bluetooth", "Win32_Devices_FunctionDiscovery", "Win32_NetworkManagement_Ndis", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_NetworkManagement_WiFi", "Win32_Networking_NetworkListManager", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Diagnostics_Etw", "Win32_System_Time", "Win32_System_Performance", "Win32_System_SystemInformation", "Wdk_Graphics_Direct3D", "Win32_UI_Shell", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
